# GestureForge v0.4 recognizer configuration.
# These provisional defaults were validated against the bundled development
# sample analysis but should remain user-configurable for other hardware.

[recognition.three_finger_swipe]
enabled = true
fingers = 3
min_distance = 200.0
min_average_velocity = 400.0
max_duration_ms = 900.0
max_axis_deviation_degrees = 30.0

[recognition.three_finger_hold]
enabled = true
fingers = 3
min_duration_ms = 650.0
max_net_distance = 30.0
